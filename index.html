<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f0f3f8" />
  <title>台灣好聲音</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles/liquid-glass-kit.css" />
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div class="lg-ambient-bg" aria-hidden="true"></div>

  <main id="app-shell" class="app-shell">
    <header class="lg-glass topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13" />
            <circle cx="6" cy="18" r="3" />
            <circle cx="18" cy="16" r="3" />
          </svg>
        </div>
        <span class="brand-title">台灣好聲音</span>
      </div>
      <button id="btn-library" class="lg-btn lg-glass-btn top-action-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" />
        </svg>
        <span id="label-library">歌庫</span>
      </button>
    </header>

    <section class="lg-ice-frame pitch-stage-wrap" aria-label="音準舞台">
      <div class="pitch-stage">
        <div class="pitch-hud">
          <span id="hud-live" class="hud-pill tabular-nums">目前 --</span>
          <span id="hud-cents" class="hud-pill tabular-nums">偏差 --</span>
          <span id="hud-accuracy" class="hud-pill tabular-nums">準確率 --%</span>
        </div>
        <div id="mic-error" class="mic-error" hidden style="display: none;"></div>
        <canvas id="pitch-canvas" width="380" height="256"></canvas>
      </div>
    </section>

    <section class="lg-glass control-card" aria-label="播放與調音控制">
      <div class="transport-row">
        <button id="btn-play" class="lg-btn play-btn" type="button" aria-label="播放或暫停" aria-pressed="false">
          <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="6 3 20 12 6 21 6 3" />
          </svg>
          <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden style="display: none;">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
        </button>

        <div class="scrub-col">
          <div class="time-row tabular-nums">
            <span id="time-current">00:00</span>
            <span id="time-total">00:15</span>
          </div>
          <input id="scrub-bar" class="range-input" type="range" min="0" max="15" step="0.05" value="0" aria-label="播放進度" />
        </div>
      </div>

      <div class="divider"></div>

      <div class="mic-controls">
        <button id="btn-mic" class="lg-btn lg-glass-btn mic-btn" type="button" aria-pressed="false">
          <span class="status-dot" aria-hidden="true"></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="22" />
          </svg>
          <span id="label-mic">開啟麥克風</span>
        </button>
        <div class="toggle-row">
          <button id="btn-mode" class="lg-btn lg-glass-btn toggle-btn" type="button" aria-pressed="false">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="label-mode">耳機模式</span>
          </button>
          <button id="btn-octave" class="lg-btn lg-glass-btn toggle-btn is-active" type="button" aria-pressed="true">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="label-octave">八度寬容：開</span>
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="slider-block">
        <div class="block-head">
          <label class="block-label" for="vocal-gain">原唱導唱音量</label>
          <span id="vocal-gain-value" class="block-val tabular-nums">100%</span>
        </div>
        <input id="vocal-gain" class="range-input" type="range" min="0" max="100" step="1" value="100" />
      </div>

      <div class="divider"></div>

      <div class="slider-block">
        <div class="block-head">
          <span class="block-label">升降調</span>
          <span class="block-label" style="font-size: 12px; color: var(--ink-3);">半音</span>
        </div>
        <div class="stepper-row">
          <button id="btn-key-down" class="lg-btn step-btn tabular-nums" type="button" aria-label="降半音">-1</button>
          <div id="key-value" class="key-readout tabular-nums">0 半音</div>
          <button id="btn-key-up" class="lg-btn step-btn tabular-nums" type="button" aria-label="升半音">+1</button>
          <button id="btn-key-reset" class="lg-btn reset-btn" type="button">歸零</button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="slider-block">
        <div class="block-head">
          <label class="block-label" for="latency-offset">延遲校準</label>
          <span id="latency-value" class="block-val tabular-nums">0 毫秒</span>
        </div>
        <input id="latency-offset" class="range-input" type="range" min="-300" max="300" step="10" value="0" />
      </div>

      <div class="divider"></div>

      <label class="lg-btn lg-glass-btn upload-song-btn" for="file-song">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <span id="label-upload-song">上傳歌曲即時分離</span>
        <input id="file-song" class="sr-only" type="file" accept="audio/*" />
      </label>
    </section>
  </main>

  <div id="library-portal" class="portal-backdrop" hidden style="display: none;" role="dialog" aria-modal="true" aria-labelledby="library-title">
    <div id="library-frame" class="lg-ice-frame portal-frame">
      <div class="lg-inner-glass portal-inner">
        <div class="portal-head">
          <h2 id="library-title" class="portal-title">離線歌庫</h2>
          <button id="btn-library-close" class="lg-btn icon-close-btn" type="button" aria-label="關閉歌庫">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <div class="portal-actions">
          <label class="lg-btn lg-glass-btn import-zip-btn" for="file-zip">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <span id="label-import-zip">匯入歌包 (.zip)</span>
            <input id="file-zip" class="sr-only" type="file" accept=".zip,application/zip" />
          </label>
          <a id="link-colab" class="lg-btn lg-glass-btn colab-link-btn" href="https://colab.research.google.com/github/bard0228/pitchlab/blob/main/pipeline/PitchLab_Colab.ipynb" target="_blank" rel="noopener noreferrer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
              <polyline points="15 3 21 3 21 9" />
              <line x1="10" y1="14" x2="21" y2="3" />
            </svg>
            <span>開啟雲端 AI 精準分軌</span>
          </a>
        </div>

        <div id="library-status" class="library-status" hidden style="display: none;"></div>

        <div id="song-list" class="song-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
